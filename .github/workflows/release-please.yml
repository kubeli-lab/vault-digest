name: Release Please

on:
  push:
    branches:
      - main
    # Only code changes can trigger a release; docs-only pushes are ignored.
    # package.json, manifest.json and .release-please-manifest.json must stay
    # listed: they change when the release PR is merged, which creates the release.
    paths:
      - "main.ts"
      - "styles.css"
      - "esbuild.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "manifest.json"
      - ".release-please-manifest.json"
  # Manual run from the Actions tab; the paths filter does not apply here.
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build the plugin once a release exists. This job runs third-party code
  # (npm packages, the build) and gets read access only: no OIDC token, no
  # write token, so a compromised dependency cannot sign or publish anything.
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      # --ignore-scripts: no package install script runs on the runner.
      - name: Build plugin
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1

  # Sign and publish the built assets. No checkout and no npm here: this job
  # only runs pinned actions and gh on the files produced by the build job.
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations for the release assets.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets

      # Lets users verify the assets were built from this repository:
      # gh attestation verify main.js --repo <owner>/vault-digest
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if ! [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag name: $TAG_NAME" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" main.js manifest.json styles.css
